<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2: bump this number whenever an icon changes, so Cloudflare and browsers fetch the new file instead of a cached copy -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevOps Studio" />
    <meta property="og:title" content="DevOps Studio | Websites & Apps Built in Mississippi" />
    <meta
      property="og:description"
      content="Custom websites and apps for businesses and organizations. Built in Mississippi, designed to look great on every phone and computer."
    />
    <meta property="og:url" content="https://devopsstudios.org/" />
    <!-- Share card picture: a screenshot of the homepage (public/og-preview.png, 1200x630).
         For the logo-only card instead, use og-image.png. Retake the screenshot if the hero changes. -->
    <meta property="og:image" content="https://devopsstudios.org/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DevOps Studio homepage: Building Digital Excellence" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The site has its own dark and light themes: stops browsers from force-darkening (recoloring) it -->
    <meta name="color-scheme" content="dark light" />
    <title>DevOps Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
